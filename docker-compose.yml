services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ndw_postgres
    environment:
      POSTGRES_USER: ndw_user
      POSTGRES_PASSWORD: ndw_password
      POSTGRES_DB: ndw_db
    ports:
      # Localhost only: the database must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndw_user -d ndw_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ndw_backend
    environment:
      DATABASE_URL: postgresql://ndw_user:ndw_password@postgres:5432/ndw_db?schema=public
      DATABASE_URL_UNPOOLED: postgresql://ndw_user:ndw_password@postgres:5432/ndw_db?schema=public
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET belum diset - isi .env di root repo}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ndw.go.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD belum diset - isi .env di root repo}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx ts-node prisma/seed.ts && npm run start:dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ndw_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
      # Next dev in Docker on a Windows bind mount needs polling to see file changes.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
