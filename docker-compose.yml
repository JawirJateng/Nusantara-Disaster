services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ndw_postgres
    environment:
      POSTGRES_USER: ndw_user
      POSTGRES_PASSWORD: ndw_password
      POSTGRES_DB: ndw_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndw_user -d ndw_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ndw_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ndw_backend
    environment:
      DATABASE_URL: postgresql://ndw_user:ndw_password@postgres:5432/ndw_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 4000
      JWT_SECRET: ndw_super_secret_jwt_key_2026
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push --skip-generate && npx ts-node prisma/seed.ts && npm run start:dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ndw_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
