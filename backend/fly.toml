app = "ndw-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 4000
  force_https = true
  # The 1-minute BMKG sync cron lives inside this Node process: never sleep.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
